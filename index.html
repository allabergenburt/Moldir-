<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особое приглашение</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #ffe0b2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .date-badge {
            display: inline-block;
            background: #ff80ab;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        p {
            color: #5a6c7d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 50px;
            position: relative;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-yes:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .btn-no {
            background-color: #f44336;
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
            position: relative;
        }

        /* Экран успешного ответа */
        .success-message {
            display: none;
        }

        .success-message h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <!-- Основной контент -->
        <div id="invitation-content">
            <div class="icon">⛰️</div>
            <span class="date-badge">23 сентября</span>
            <h1>Пойдём на Треннинкур?</h1>
            <p>Ты как-то говорила, что хотела бы туда сходить. Я помню. 23 сентября — особенная для нас дата, и мне очень хотелось бы провести этот день вместе на свежем воздухе.</p>
            
            <div class="buttons">
                <button class="btn btn-yes" onclick="acceptInvitation()">Идём! ✨</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Не идём</button>
            </div>
        </div>

        <!-- Сообщение после нажатия "Идём!" -->
        <div class="success-message" id="successContent">
            <div class="icon">❤️</div>
            <h2>Ура! Я очень рад!</h2>
            <p>Увидимся 23 сентября. Напишу тебе, чтобы обсудить время и детали!</p>
        </div>
    </div>

    <script>
        // Функция для кнопки "Не идём" (убегает от курсора)
        function moveButton() {
            const btn = document.getElementById('noBtn');
            // Случайное смещение
            const x = Math.random() * (window.innerWidth < 500 ? 100 : 200) - 100;
            const y = Math.random() * 100 - 50;
            
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Функция при согласии
        function acceptInvitation() {
            document.getElementById('invitation-content').style.display = 'none';
            document.getElementById('successContent').style.display = 'block';
        }
    </script>
</body>
</html>
